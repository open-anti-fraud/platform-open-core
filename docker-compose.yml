x-backend-env: &backend-env
  env_file: .env
  environment:
    # Postgres
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DB_HOST: postgres
    DB_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}

    # Redis / Memcached / Rabbit
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CACHE_SERVICE: memcached
    CACHE_PORT: "11211"
    RABBIT_HOST: rabbitmq
    RABBIT_PORT: "5672"
    RABBIT_ADMIN_PORT: "15672"
    RABBIT_USER: ${RABBIT_USER}
    RABBIT_PASSWORD: ${RABBIT_PASSWORD}
    BROKER_HOST: rabbitmq
    BROKER_PORT: "5672"
    BROKER_USER: ${RABBIT_USER}
    BROKER_PASSWORD: ${RABBIT_PASSWORD}

    # External services
    MATCHER_HOST: matcher
    MATCHER_PORT: "80"
    MATCHER_SERVICE_HOST: matcher
    MATCHER_SERVICE_PORT: "80"
    ACTIVITY_MATCHER_SERVICE_HOST: activity-matcher
    ACTIVITY_MATCHER_SERVICE_PORT: "80"
    LICENSE_SERVICE_HOST: licensing
    LICENSE_SERVICE_PORT: "80"
    IMAGE_API_SERVICE_MAP: "{}"
    TRACING_ENABLED: "false"
    TRACER_HOST: localhost
    TRACER_PORT: "4317"

    # Auth / bootstrap
    SERVICE_KEY: ${SERVICE_KEY}
    PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
    PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
    PLATFORM_DEFAULT_EMAIL: ${PLATFORM_DEFAULT_EMAIL}
    PLATFORM_DEFAULT_PASSWORD: ${PLATFORM_DEFAULT_PASSWORD}

    # Email (empty OK)
    EMAIL_HOST: ""
    EMAIL_PORT: ""
    EMAIL_HOST_USER: ""
    EMAIL_HOST_PASSWORD: ""
    EMAIL_FROM: ""
    EMAIL_USE_SSL: ""

    # App
    BASE_SITE_URL: http://localhost:8080
    BACKEND_PORT: "80"
    WORKERS: "2"
    DEBUG: "false"
    CAPTURER_NAME: common_capturer_uld_fda.xml
    DEFAULT_TEMPLATE_VERSION: template12v1000
    ACTIVITY_TTL: "2592000"
    RETENTION_ACTIVITIES_COUNT: "1000"
    ACTIVITY_HANDLER_PERIOD: "604800"
    SAMPLE_TTL: "2592000"
    BEST_QUALITY_THRESHOLD: "-750"
    PASS_QUALITY_THRESHOLD: "-900"
    CREATE_PROFILE_QUALITY_THRESHOLD: "0.2"
    AGENT_STATUS_CHECK_PERIOD: "30"
    AGENT_EVENTS_QUEUE: agent-events-queue
    LICENSING_EVENTS_QUEUE: licensing-events-queue
    SERVICE_QUEUE: service-queue
    RETENTION_POLICY_QUEUE: retention-policy-queue
    ACTIVITY_EVENTS_QUEUE: activity-events-queue
    MATCHER_CALL_QUEUE: matcher-call-queue
    MATCHER_SCHEDULE_EVENTS_QUEUE: matcher-schedule-events-queue
    ACTIVITY_MATCHER_EVENTS_QUEUE: activity-matcher-events-queue
    DEFERRED_PROFILE_DELETION: deferred-profile-deletion
    DEFERRED_REMOVE_PROFILES_FROM_GROUPS_QUEUE: deferred-remove-profiles-from-groups
    DEFERRED_REMOVE_PROFILES_FIELD_QUEUE: deferred-remove-profiles-field
    CREATE_DEFERRED_REMOVE_TASKS_QUEUE: create-deferred-remove-tasks
    DELETE_BATCH_SIZE: "100"
    DELETE_SAMPLE_BATCH_SIZE: "1000"
    DEFAULT_OFFLINE_TIMEOUT: "43200"
    MAX_IMAGE_WIDTH: "10000"
    MAX_IMAGE_HEIGHT: "10000"
    MAX_IMAGE_SIZE: "5000000"
    HTTP_REQUEST_TIMEOUT: "30"
    WORKER_CLASS: gthread
    WORKER_KEEPALIVE: "60"
    WORKER_CONNECTIONS: "2"
    WORKER_REUSE_PORT: "true"
    WORKER_THREADS: "1"
    WORKER_MAX_REQUESTS: "35000"
    WORKER_MAX_REQUESTS_JITTER: "14000"
    WORKER_DB_CONNECTION_MAX_AGE: "900"
    QUERY_LIMIT: "100"
    APP_VERSION: "1.0.0"
    CONTACT_NAME: Platform Team
    CONTACT_PRODUCT_NAME: Platform
    CONTACT_URL: http://example.com/contact
    TERMS_URL: http://example.com/terms-of-serivce
    COMPANY_DOMAIN: example.com
    COMPANY_SHORT_NAME: example-short-name
    COMPANY_FULL_NAME: example-full-name
    REQUIRED_PROFILE_FIELDS: name,age,gender,birthday,avatar_id,main_sample_id,description
    REQUIRED_CAMERA_FIELDS: title,stream,type,width,height,real_name
    INDEX_UPDATE_PERIOD: "60"
    VERIFY_LICENSE_DELTA: "60"
    PROFILE_MATCHER_SERVICE_TIMEOUT: "10"
    ACTIVITY_MATCHER_SERVICE_TIMEOUT: "10"
    LIVENESS_SERVICE_PROVIDER: face-detector-liveness-estimator
    PLATFORM_MATCHER_EXCHANGE_NAME: platform-matcher-exchange
    DISABLE_WORKSPACE_SEARCH_INDEX: "false"
    MAX_RMQ_CONNECTION: "1"
    RPC_TIMEOUT: "5"
    ARBITER_HEARTBEAT: "6"
    SERVICE_NAME: platform-backend
    CALCULATED_ATTRIBUTES: gender,age,has_medical_mask,quality,emotions,liveness
    ENABLE_AGENT: "true"
    ENABLE_PROFILE_AUTOGENERATION: ""

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  memcached:
    image: memcached:1.6-alpine
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc -w 1 127.0.0.1 11211 | grep -q STAT"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-init:
    <<: *backend-env
    image: ghcr.io/open-anti-fraud/platform-open-core/backend:latest
    build:
      context: ./svc/backend
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py init_database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_healthy

  backend:
    <<: *backend-env
    image: ghcr.io/open-anti-fraud/platform-open-core/backend:latest
    build:
      context: ./svc/backend
    ports:
      - "8080:80"
    depends_on:
      backend-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_healthy

volumes:
  # Named volume persists across `docker compose down` / recreate.
  # Destroy only with `docker compose down -v`.
  postgres_data:
    name: platform_postgres_data
